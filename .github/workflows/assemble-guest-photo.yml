name: Assemble guest photo

on:
  push:
    branches:
      - fix/guest-photo-jpeg-20260814

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[assembled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guest-photo-jpeg-20260814
          fetch-depth: 0
      - name: Assemble JPEG and update page
        shell: bash
        run: |
          cat tmp/guest-photo-1.b64 tmp/guest-photo-2.b64 tmp/guest-photo-3.b64 tmp/guest-photo-4.b64 | base64 -d > public/recent-guests-austria.jpg
          file public/recent-guests-austria.jpg
          sed -i 's#/recent-guests-austria.webp#/recent-guests-austria.jpg#g' app/page.tsx
          rm -f tmp/guest-photo-1.b64 tmp/guest-photo-2.b64 tmp/guest-photo-3.b64 tmp/guest-photo-4.b64
          rm -f .github/workflows/assemble-guest-photo.yml
          rmdir tmp 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use standard JPEG for recent guest photo [assembled]"
          git push origin HEAD:fix/guest-photo-jpeg-20260814
