name: H+ Astro Preview CI

on:
  push:
    branches:
      - preview/hplus-astro-resume
  pull_request:
    paths:
      - 'astro-preview/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Build Astro preview
        run: npm run build
