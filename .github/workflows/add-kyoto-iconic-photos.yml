name: Add iconic Kyoto photos

on:
  push:
    branches: [ui/kyoto-iconic-photos-20260814]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/kyoto-iconic-photos-20260814
      - name: Patch page and styles
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()
          old = '''      <section className="content-section" id="routes">\n        <div className="section-head"><p className="section-kicker">Representative routes</p><h2>Three simple ideas — then we adjust</h2></div>'''
          new = '''      <section className="content-section" id="routes">\n        <div className="section-head"><p className="section-kicker">Representative routes</p><h2>Three simple ideas — then we adjust</h2></div>\n        <div className="kyoto-icon-grid" aria-label="Iconic Kyoto views">\n          <figure className="kyoto-icon-card">\n            <img src="/kyoto/fushimi-inari.jpg" alt="Vermilion torii gates at Fushimi Inari Shrine in Kyoto" loading="lazy" />\n            <figcaption><strong>Fushimi Inari</strong><span>Thousands of vermilion torii gates — one of Kyoto’s most recognisable sights.</span></figcaption>\n          </figure>\n          <figure className="kyoto-icon-card">\n            <img src="/kyoto/nijo-castle.jpg" alt="Historic Nijo Castle in Kyoto" loading="lazy" />\n            <figcaption><strong>Nijo Castle</strong><span>Shogun history in the heart of Kyoto.</span></figcaption>\n          </figure>\n        </div>'''
          if old not in text:
              raise SystemExit('Route insertion point not found')
          page.write_text(text.replace(old, new, 1))

          css = Path('app/globals.css')
          styles = '''\n\n/* Iconic Kyoto views */\n.kyoto-icon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0 0 20px}.kyoto-icon-card{margin:0;overflow:hidden;border:1px solid rgba(190,166,137,.3);border-radius:20px;background:rgba(255,255,255,.86);box-shadow:0 10px 30px rgba(73,54,34,.055)}.kyoto-icon-card img{width:100%;height:230px;object-fit:cover}.kyoto-icon-card:first-child img{object-position:center 52%}.kyoto-icon-card:last-child img{object-position:center 48%}.kyoto-icon-card figcaption{display:flex;align-items:baseline;gap:10px;padding:13px 16px 15px;color:#5d5147;font-size:.86rem;line-height:1.5}.kyoto-icon-card figcaption strong{flex:0 0 auto;color:#2f2a24;font-size:.95rem}.kyoto-icon-card figcaption span{color:#6a5d50}@media(max-width:760px){.kyoto-icon-grid{grid-template-columns:1fr;gap:12px;margin-bottom:16px}.kyoto-icon-card img{height:210px}.kyoto-icon-card figcaption{display:block;padding:12px 14px 14px}.kyoto-icon-card figcaption strong{display:block;margin-bottom:3px}}@media(max-width:430px){.kyoto-icon-card img{height:185px}}\n'''
          current = css.read_text()
          if '/* Iconic Kyoto views */' not in current:
              css.write_text(current + styles)

          Path('.github/workflows/add-kyoto-iconic-photos.yml').unlink()
          PY
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css .github/workflows/add-kyoto-iconic-photos.yml
          git commit -m "ui: add iconic Fushimi Inari and Nijo Castle photos"
          git push
