name: Next14 lockfile regeneration

on:
  push:
    branches:
      - tech/next14-lockfile-github-20260814

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-next14
          path: package-lock.json

      - name: Clean install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate package-lock for Next.js 14"
          git push
