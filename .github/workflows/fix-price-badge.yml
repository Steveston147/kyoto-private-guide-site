name: Fix price badge overlap
on:
  push:
    branches: [ui/kyoto-iconic-photos-20260814]
    paths: ['.github/workflows/fix-price-badge.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/kyoto-iconic-photos-20260814
      - name: Fix badge layout
        run: |
          cat >> app/globals.css <<'EOF'

/* Keep the Full Day badge clear of its heading */
.price-badge{position:static;left:auto;top:auto;transform:none;align-self:center;margin:0 0 8px}
EOF
          rm .github/workflows/fix-price-badge.yml
      - name: Commit final change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css .github/workflows/fix-price-badge.yml
          git commit -m 'fix: prevent price badge overlap'
          git push
